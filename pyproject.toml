[project]
name = "embodied-agentos"
version = "0.1.0"
description = "Long-term-memory-enhanced embodied AgentOS prototype"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14"
]

[project.optional-dependencies]
llm = [
  "openai>=2,<3"
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6"
]

[project.scripts]
agentos = "agentos.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
